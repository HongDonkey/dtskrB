spring.application.name=dtskrB

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:digimon_time_stranger}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.request-board.upload-directory=${REQUEST_UPLOAD_DIR:uploads/requests}
app.request-board.rate-limit.create.limit=${REQUEST_CREATE_RATE_LIMIT:3}
app.request-board.rate-limit.create.window=${REQUEST_CREATE_RATE_WINDOW:10m}
app.request-board.rate-limit.lookup.limit=${REQUEST_LOOKUP_RATE_LIMIT:10}
app.request-board.rate-limit.lookup.window=${REQUEST_LOOKUP_RATE_WINDOW:5m}
app.request-board.ip-retention-period=${REQUEST_IP_RETENTION_PERIOD:30d}
app.request-board.ip-cleanup-initial-delay=${REQUEST_IP_CLEANUP_INITIAL_DELAY:1m}
app.request-board.ip-cleanup-interval=${REQUEST_IP_CLEANUP_INTERVAL:24h}
app.admin.bootstrap.login-id=${ADMIN_BOOTSTRAP_LOGIN_ID:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.bootstrap.display-name=${ADMIN_BOOTSTRAP_DISPLAY_NAME:Administrator}

server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=DTSKR_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

# Safe logging defaults. Verbose SQL logging is enabled only by the dev profile.
logging.level.org.flywaydb.core.internal.sqlscript.DefaultSqlScriptExecutor=INFO
logging.level.p6spy=OFF
logging.level.org.springframework.jdbc.core.JdbcTemplate=OFF
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.com.digimon.dtskrB.digimon.controller.AdminAuthController=INFO
