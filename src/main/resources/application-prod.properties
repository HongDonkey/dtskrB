# Production defaults. The reverse proxy must terminate HTTPS.
server.forward-headers-strategy=framework
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

# Prefer a separate schema-migration account in production. Falls back to the runtime account
# only when dedicated Flyway credentials have not been configured yet.
spring.flyway.user=${FLYWAY_DB_USERNAME:${DB_USERNAME}}
spring.flyway.password=${FLYWAY_DB_PASSWORD:${DB_PASSWORD}}

# Do not expose internal exception details to API clients.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Prevent SQL statements and bound values from being written to production logs.
logging.level.root=INFO
logging.level.p6spy=OFF
logging.level.org.flywaydb.core.internal.sqlscript.DefaultSqlScriptExecutor=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=OFF
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
