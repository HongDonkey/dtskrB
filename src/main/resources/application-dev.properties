# Development-only SQL logging. Activate with SPRING_PROFILES_ACTIVE=dev.
spring.datasource.url=jdbc:p6spy:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:digimon_time_stranger}?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver

logging.level.org.flywaydb.core.internal.sqlscript.DefaultSqlScriptExecutor=DEBUG
logging.level.p6spy=INFO
